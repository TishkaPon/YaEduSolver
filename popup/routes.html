<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; }
    body {
      width: 240px; padding: 18px 16px;
      background: #f6f7f9; color: #1b1f24;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .row { display: flex; align-items: center; gap: 10px; }
    .mark {
      width: 28px; height: 28px; border-radius: 8px; flex: 0 0 auto;
      display: flex; align-items: center; justify-content: center;
      background: #4d6bfe; color: #fff; font-weight: 700;
    }
    .name { font-weight: 650; }
    .hint { color: #7a828e; font-size: 11px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="row">
    <div class="mark">Я</div>
    <div class="name">YaEduSolver</div>
  </div>
  <div class="hint">Открываю нужный режим…</div>
  <script src="routes.js"></script>
</body>
</html>
